<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Terminal - Checkout Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-full {
            grid-column: 1 / -1;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
        
        button.success {
            background: var(--success);
        }
        button.success:hover {
            background: #059669;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .console {
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #a7f3d0;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        button.loading .loader { display: inline-block; }
        button.loading span { display: none; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel de Conexión -->
        <div class="panel">
            <div>
                <h1>POS IM30 Manager</h1>
                <p>Simulador de conexión y venta con SDK Transbank</p>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Estado</h2>
                <div class="status-badge" id="statusBadge">
                    <div class="status-dot"></div>
                    <span id="statusText">Desconectado</span>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; flex-direction: column;">
                <div class="form-group">
                    <label for="portSelect">Puerto del Equipo</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <select id="portSelect" style="flex: 1; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); color: var(--text-main); padding: 0.875rem 1rem; border-radius: 0.75rem; font-size: 1rem; outline: none; appearance: none;">
                            <option value="">-- Escanea para buscar puertos --</option>
                        </select>
                        <button id="btnScan" onclick="scanPorts()" style="padding: 0 1rem;" title="Escanear Puertos">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                        </button>
                    </div>
                </div>

                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button id="btnConnectManual" onclick="connectToPort()" style="flex: 1; min-width: 140px;">
                        <span>Conectar a Puerto</span>
                        <div class="loader"></div>
                    </button>
                    <button id="btnConnect" onclick="connectPOS()" style="flex: 1; min-width: 140px; background: rgba(255,255,255,0.1);">
                        <span>Auto-Conectar (SDK)</span>
                        <div class="loader"></div>
                    </button>
                    <button id="btnLoopConnect" onclick="loopConnectAllPorts()" style="flex: 1 1 100%; background: #8b5cf6;">
                        <span>Bucle: Probar Todos los Puertos</span>
                        <div class="loader"></div>
                    </button>
                </div>
                
                <button id="btnLoadKeys" onclick="loadKeys()" style="background: rgba(255,255,255,0.1); margin-top: 0.5rem;">
                    <span>Cargar Llaves</span>
                    <div class="loader"></div>
                </button>
            </div>
        </div>

        <!-- Panel de Venta -->
        <div class="panel">
            <h2>Simular Compra</h2>
            <p>Ingresa un monto para enviar la orden al POS.</p>

            <div class="form-group">
                <label for="amount">Monto de Venta ($)</label>
                <input type="number" id="amount" placeholder="Ej. 1500" value="1500">
            </div>

            <button class="success" id="btnSale" onclick="processSale()" style="margin-top: auto;">
                <span>Pagar en POS</span>
                <div class="loader"></div>
            </button>
        </div>

        <!-- Panel de Consola / Logs -->
        <div class="panel panel-full">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Terminal Logs</h2>
                <button onclick="clearLogs()" style="background: transparent; border: 1px solid var(--border); padding: 0.25rem 0.75rem; font-size: 0.75rem;">Limpiar</button>
            </div>
            <div class="console" id="consoleOutput">Bienvenido. Listo para operar...
</div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/pos';
        const consoleEl = document.getElementById('consoleOutput');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');

        function log(message, data = null) {
            const time = new Date().toLocaleTimeString();
            let text = `[${time}] ${message}\n`;
            if (data) {
                text += JSON.stringify(data, null, 2) + '\n';
            }
            consoleEl.textContent += text + '\n';
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function clearLogs() {
            consoleEl.textContent = 'Bienvenido. Listo para operar...\n';
        }

        function setConnected(isConnected) {
            if (isConnected) {
                statusBadge.classList.add('connected');
                statusText.textContent = 'Conectado';
            } else {
                statusBadge.classList.remove('connected');
                statusText.textContent = 'Desconectado';
            }
        }

        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        async function scanPorts() {
            const btnScan = document.getElementById('btnScan');
            const portSelect = document.getElementById('portSelect');
            
            btnScan.style.opacity = '0.5';
            btnScan.disabled = true;
            log('Escaneando puertos seriales...');
            
            try {
                const res = await fetch(`${API_BASE}/ports`);
                const data = await res.json();
                
                portSelect.innerHTML = ''; // Limpiar opciones
                
                if (data.success && data.ports && data.ports.length > 0) {
                    log(`Se encontraron ${data.ports.length} puertos.`);
                    data.ports.forEach(port => {
                        const option = document.createElement('option');
                        option.value = port.path;
                        option.textContent = `${port.path} ${port.manufacturer ? `(${port.manufacturer})` : ''}`;
                        portSelect.appendChild(option);
                    });
                } else {
                    log('No se encontraron puertos seriales.');
                    portSelect.innerHTML = '<option value="">No hay puertos disponibles</option>';
                }
            } catch (error) {
                log('Error al escanear puertos', error.message);
            }
            
            btnScan.style.opacity = '1';
            btnScan.disabled = false;
        }

        async function connectToPort() {
            const portName = document.getElementById('portSelect').value;
            if (!portName) {
                alert('Por favor, selecciona un puerto primero.');
                return;
            }

            setLoading('btnConnectManual', true);
            log(`Conectando al puerto ${portName}...`);
            try {
                const res = await fetch(`${API_BASE}/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ portName })
                });
                const data = await res.json();
                
                if (data.success) {
                    log(`Éxito: ${data.message}`);
                    setConnected(true);
                } else {
                    log('Error de conexión', data);
                    setConnected(false);
                }
            } catch (error) {
                log('Error de red al conectar', error.message);
                setConnected(false);
            }
            setLoading('btnConnectManual', false);
        }

        async function loopConnectAllPorts() {
            setLoading('btnLoopConnect', true);
            log('Iniciando bucle de conexión en todos los puertos...');
            
            try {
                // 1. Obtener todos los puertos y filtrar solo los ttyACM
                const res = await fetch(`${API_BASE}/ports`);
                const data = await res.json();
                
                if (!data.success || !data.ports || data.ports.length === 0) {
                    log('No se encontraron puertos para probar.');
                    setLoading('btnLoopConnect', false);
                    return;
                }

                // Filtrar para que solo pruebe ttyACM0, ttyACM1, ttyACM2...
                const filteredPorts = data.ports.filter(port => port.path.includes('ttyACM'));

                if (filteredPorts.length === 0) {
                    log('No se encontró ningún puerto ttyACM disponible.');
                    setLoading('btnLoopConnect', false);
                    return;
                }

                log(`Se probarán ${filteredPorts.length} puertos secuencialmente (solo ttyACM)...`);
                let connected = false;

                // 2. Iterar y probar uno por uno
                for (let i = 0; i < filteredPorts.length; i++) {
                    const portName = filteredPorts[i].path;
                    log(`[Intento ${i+1}/${filteredPorts.length}] Probando ${portName}...`);
                    
                    try {
                        const connRes = await fetch(`${API_BASE}/connect`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ portName })
                        });
                        const connData = await connRes.json();
                        
                        if (connData.success) {
                            log(`¡Éxito! Conectado al puerto ${portName}`);
                            setConnected(true);
                            connected = true;
                            // Actualizar el select visualmente
                            const portSelect = document.getElementById('portSelect');
                            if (Array.from(portSelect.options).some(opt => opt.value === portName)) {
                                portSelect.value = portName;
                            }
                            break; // Detener el bucle al tener éxito
                        } else {
                            log(`Falló ${portName}: ${connData.message || connData.error}`);
                        }
                    } catch (e) {
                        log(`Error de red con ${portName}`);
                    }
                }

                if (!connected) {
                    log('El bucle terminó. No se pudo conectar a ningún puerto.');
                    setConnected(false);
                }
            } catch (error) {
                log('Error general en el bucle', error.message);
            }
            
            setLoading('btnLoopConnect', false);
        }

        async function connectPOS() {
            setLoading('btnConnect', true);
            log('Intentando conectar al POS...');
            try {
                const res = await fetch(`${API_BASE}/autoconnect`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    log(`Éxito: ${data.message} (${data.port})`, data);
                    setConnected(true);
                } else {
                    log('Error de conexión', data);
                    setConnected(false);
                }
            } catch (error) {
                log('Error de red al conectar', error.message);
                setConnected(false);
            }
            setLoading('btnConnect', false);
        }

        async function loadKeys() {
            setLoading('btnLoadKeys', true);
            log('Enviando comando LoadKeys al POS...');
            try {
                const res = await fetch(`${API_BASE}/loadKeys`, { method: 'POST' });
                const data = await res.json();
                log('Respuesta de Llaves:', data);
            } catch (error) {
                log('Error de red', error.message);
            }
            setLoading('btnLoadKeys', false);
        }

        async function processSale() {
            const amount = document.getElementById('amount').value;
            if (!amount || amount <= 0) {
                alert('Ingresa un monto válido');
                return;
            }

            setLoading('btnSale', true);
            const ticketId = Math.floor(Math.random() * 90000) + 10000; // Random ticket
            log(`Iniciando venta... Monto: $${amount} | Ticket: ${ticketId}`);
            
            try {
                const res = await fetch(`${API_BASE}/payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, ticket: ticketId })
                });
                const data = await res.json();
                log('Resultado de Venta:', data);
            } catch (error) {
                log('Error de red en venta', error.message);
            }
            setLoading('btnSale', false);
        }

        // Hacemos un poll inicial rápido por si ya estaba conectado
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_BASE}/poll`);
                const data = await res.json();
                if (data.success) {
                    setConnected(true);
                    log('El equipo ya se encontraba conectado.');
                }
            } catch (e) {
                // Ignore silent error on load
            }
        });
    </script>
</body>
</html>
